name: Vela
options:
  bundleIdPrefix: com.baodi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: S4BS47942Q
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  TeslaBLE:
    # Fork of shoujiaxin/swift-tesla-ble that maps location, media playback
    # status and the other CarServer fields the upstream mapper drops.
    url: https://github.com/lwshanbd/swift-tesla-ble
    revision: 6f1fefa2f5c293fdabc7f1ac494bdc09f346b642

targets:
  Vela:
    type: application
    platform: iOS
    sources:
      - path: Vela
    dependencies:
      - package: TeslaBLE
        product: TeslaBLE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baodi.vela
        PRODUCT_NAME: Vela
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vela
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Vela connects to your Tesla over Bluetooth to show speed, gear and battery, and to control climate and music."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Vela:
    build:
      targets:
        Vela: all
    run:
      config: Debug
    archive:
      config: Release
